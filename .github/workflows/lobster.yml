name: "lobster checks"
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "lobster.sh"
      - "tests/**"

jobs:
  sh-checker:
    name: Shellcheck + Shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run the sh-checker
        uses: luizm/action-sh-checker@master
        env:
          SHELLCHECK_OPTS: -s sh -o all -e 2250
          SHFMT_OPTS: -i 4 -ci -d

  smoke-test:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run tests/smoke.sh
        run: sh tests/smoke.sh

  check-exec:
    name: Executable Bit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: test exec bit
        run: test -x "./lobster.sh"
